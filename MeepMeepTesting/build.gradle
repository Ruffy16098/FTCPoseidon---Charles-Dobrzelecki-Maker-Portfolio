plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

//Gradle Scripts for MeepMeep
repositories {
    maven { url = 'https://maven.brott.dev/' }
}

//Gradle Scripts for MeepMeep
dependencies {
    implementation 'com.acmerobotics.roadrunner:MeepMeep:0.1.6'
}